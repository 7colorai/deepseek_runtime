[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-runtime"
version = "0.1.1a0"
description = "Fork-ready DeepSeek-native Python runtime kernel for local Agents"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
readme = "README.md"
authors = [{name = "7colorai"}]

[project.scripts]
deepseek-runtime = "deepseek_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
